plugins {
id 'com.android.application'
}

android {
namespace 'com.vmware.workstation.mobile'
compileSdk 35

defaultConfig {
    applicationId 'com.vmware.workstation.mobile'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '1.0.0'

    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

}
